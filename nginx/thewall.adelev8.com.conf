server {
    server_name thewall.adelev8.com;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/thewall.adelev8.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thewall.adelev8.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://2thewall.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thewall.adelev8.com;
    return 301 https://2thewall.in$request_uri;
}
