server {
    server_name 2thewall.in www.2thewall.in;

    client_max_body_size 20M;

    # Static poster images — served directly by nginx for performance
    location /images/ {
        alias /root/websites/thewall/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /logo.png {
        alias /root/websites/thewall/public/logo.png;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /qr/ {
        alias /root/websites/thewall/public/qr/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SSR app + API + admin
    location / {
        proxy_pass http://127.0.0.1:5184;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/2thewall.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/2thewall.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = www.2thewall.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = 2thewall.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name 2thewall.in www.2thewall.in;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot




}